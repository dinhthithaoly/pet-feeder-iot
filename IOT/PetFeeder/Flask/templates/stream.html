{% extends "layout.html" %} {% block title %}Camera{% endblock %} {% block main
%}

<h2 class="mb-3"><i class="bi bi-camera-video"></i> Camera trực tiếp</h2>

<div class="text-center">
  <img
    src="/video_feed"
    class="img-fluid rounded shadow"
    style="max-width: 80%"
  />
</div>

<hr />

<h3><i class="bi bi-info-circle"></i> Trạng thái</h3>

<div class="row mt-3">
  <div class="col-md-6">
    <div class="card shadow-sm p-3">
      <h5><i class="bi bi-emoji-smile"></i> Pet</h5>
      <span id="pet" class="badge bg-secondary p-2">Đang kiểm tra...</span>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card shadow-sm p-3">
      <h5><i class="bi bi-basket-fill"></i> Lần ăn gần nhất</h5>
      <span id="last_feed" class="badge bg-info p-2">--</span>
    </div>
  </div>
</div>

<script>
  function updateStatus() {
    fetch("/api/status")
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("pet").innerText = data.pet;
        document.getElementById("last_feed").innerText = data.last_feed ?? "--";
      });
  }
  setInterval(updateStatus, 1000);
</script>

{% endblock %}
